<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F6F7F4" />
    <meta name="description" content="ReguLens: answers about MAS guidelines with citations, and annual-report extraction." />
    <title>ReguLens</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' fill='%23F6F7F4'/%3E%3Crect x='3' y='9' width='18' height='6' fill='%23E4EE9C' stroke='%2318222E' stroke-width='1.5'/%3E%3Cpath d='M3 5h18M3 19h12' stroke='%230F5E66' stroke-width='2'/%3E%3C/svg%3E" />
    <script>
      // Apply the saved theme before the first paint (see src/theme.ts).
      try {
        if (localStorage.getItem("regulens-theme") === "dark") {
          document.documentElement.dataset.theme = "dark";
          document.querySelector('meta[name="theme-color"]').setAttribute("content", "#000000");
        }
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Light: Public Sans (UI) + Newsreader (source text). Dark: Prompt Light (headings, stats)
         + Work Sans (UI) + Newsreader. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&family=Prompt:wght@300&family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Work+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
