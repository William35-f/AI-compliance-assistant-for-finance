[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "regulens"
version = "0.1.0"
description = "AI assistant for Singapore financial compliance (MAS guidelines + SGX annual reports)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",  # required by FastAPI's TestClient
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["regulens*"]

[tool.setuptools.package-data]
regulens = ["*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs a running Postgres (skipped automatically if unreachable)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/F: pyflakes + pycodestyle, I: import sorting, UP: modern syntax, B: common bugs
select = ["E", "F", "I", "UP", "B"]
