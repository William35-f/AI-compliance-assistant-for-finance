[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "regulens"
version = "1.0.0"
description = "AI assistant for Singapore financial compliance (MAS guidelines + SGX annual reports)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",        # psycopg adapter for the `vector` type
    "pymupdf>=1.24",        # PDF text extraction with fonts and positions
    "fastembed>=0.9,<0.10", # local ONNX embedding models (we use its tokenizer too)
    "google-genai>=1.0",    # Gemini API client
    "python-multipart>=0.0.9",  # file uploads in FastAPI (POST /extract)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",  # required by FastAPI's TestClient
    "ruff==0.17.4",  # pinned: CI's format check must match local formatting
]

[tool.setuptools.packages.find]
include = ["regulens*"]

[tool.setuptools.package-data]
regulens = ["*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs a running Postgres (skipped automatically if unreachable)",
    "live: calls the real Gemini API (skipped unless GEMINI_API_KEY is set)",
]
