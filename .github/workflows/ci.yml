name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Lint + tests (backend)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: regulens
          POSTGRES_PASSWORD: regulens
          POSTGRES_DB: regulens
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U regulens" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://regulens:regulens@localhost:5432/regulens
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e "backend[dev]"
      - name: Ruff (lint + format check)
        run: |
          ruff check backend scripts eval
          ruff format --check backend scripts eval
      - name: Pytest (unit + integration against pgvector; live Gemini tests are skipped)
        run: pytest backend -q

  frontend:
    name: Type-check + build (frontend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  smoke-eval:
    name: Smoke eval (20 questions, real Gemini)
    needs: backend
    # Costs ~40 free-tier Gemini requests, so only on main or when started by hand.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: regulens
          POSTGRES_PASSWORD: regulens
          POSTGRES_DB: regulens
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U regulens" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://regulens:regulens@localhost:5432/regulens
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      # Minimum answer correctness on the first 20 questions; set from measured runs.
      MIN_CORRECTNESS: "0.6"
    steps:
      - name: Skip when the GEMINI_API_KEY secret is not configured
        if: env.GEMINI_API_KEY == ''
        run: echo "::warning::GEMINI_API_KEY secret not set; smoke eval skipped."
      - uses: actions/checkout@v4
        if: env.GEMINI_API_KEY != ''
      - uses: actions/setup-python@v5
        if: env.GEMINI_API_KEY != ''
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Cache the embedding model
        if: env.GEMINI_API_KEY != ''
        uses: actions/cache@v4
        with:
          path: .cache/models
          key: models-${{ hashFiles('backend/regulens/config.py') }}
      - if: env.GEMINI_API_KEY != ''
        run: pip install -e "backend[dev]"
      - name: Download MAS PDFs and ingest them
        if: env.GEMINI_API_KEY != ''
        run: |
          python scripts/download_sources.py --doc-type regulation
          python scripts/ingest.py --index heading --doc-type regulation
      - name: Run 20-question eval and enforce the threshold
        if: env.GEMINI_API_KEY != ''
        run: >
          python eval/run_eval.py --name ci-smoke --limit 20 --no-summary
          --fail-under "$MIN_CORRECTNESS"
      - name: Keep the run file
        if: always() && env.GEMINI_API_KEY != ''
        uses: actions/upload-artifact@v4
        with:
          name: smoke-eval
          path: eval/results/*ci-smoke*.json
